name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        target: [bun-darwin-arm64, bun-darwin-x64, bun-linux-x64, bun-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version package.json)"
      - name: Build
        run: |
          name="code-mode-${{ matrix.target }}"; name="${name/bun-/}"
          bun build --compile --minify --target=${{ matrix.target }} src/index.ts --outfile "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && shasum -a 256 code-mode-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
